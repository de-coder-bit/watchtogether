server:
  port: ${PORT:8088}
  servlet:
    context-path: /

spring:
  application:
    name: watchtogether-backend
  
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:watchtogether;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Security
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# Storage configuration (local, s3, r2, b2, minio)
app:
  storage:
    provider: ${STORAGE_PROVIDER:local} # "local" or "s3"
    local-dir: ${STORAGE_LOCAL_DIR:./storage}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:auto}
      bucket-name: ${S3_BUCKET_NAME:watchtogether}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      public-url: ${S3_PUBLIC_URL:}
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    hls-segment-duration: 4
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.netlify.app}
